[metadata]
# All metadata is defined in pyproject.toml
# This file only contains build configuration

[build_ext]
# Custom build command that builds the static library first
# This replaces the custom build_ext class from setup.py

[options]
packages = find:
package_dir =
    = .

[options.packages.find]
where = .

[options.package_data]
* = *.c, *.h, *.a, *.o

[options.exclude_package_data]
* = *.test, *.test.*, test.*, test
