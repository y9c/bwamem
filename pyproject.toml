[build-system]
requires = ["setuptools>=61.0", "wheel", "cffi"]
build-backend = "setuptools.build_meta"

[project]
name = "bwamem"
version = "0.0.7"
description = "Bindings to bwa aligner"
readme = "README.md"
license = "MPL-2.0"
authors = [
    {name = "Chang Ye", email = "yech1990@gmail.com"}
]
maintainers = [
    {name = "Chang Ye", email = "yech1990@gmail.com"}
]
keywords = ["bioinformatics", "alignment", "bwa", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = [
    "cffi>=1.0.0",
    "setuptools>=75.3.2",
    "wheel>=0.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "ruff",
    "twine",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/y9c/bwamem"
Repository = "https://github.com/y9c/bwamem"
Documentation = "https://y9c.github.io/bwamem/"
"Bug Tracker" = "https://github.com/y9c/bwamem/issues"

[project.scripts]
bwamempy = "bwamem.libbwa:main"

[tool.setuptools]
packages = ["bwamem"]

[tool.setuptools.package-data]
bwamem = []

[tool.setuptools.exclude-package-data]
"*" = ["*.test", "*.test.*", "test.*", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "twine>=6.1.0",
]
