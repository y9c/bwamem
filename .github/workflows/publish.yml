name: Upload Python Package

on:
  push:
    branches: [main, master]
    paths:
      - 'pyproject.toml'
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build BWA static library (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev build-essential
          make bwa/libbwa.a

      - name: Build BWA static library (macOS only)
        if: matrix.os == 'macos-latest'
        run: |
          brew install zlib
          make bwa/libbwa.a

      - name: Build BWA static library (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          # Windows build would need different approach
          # For now, we'll skip Windows builds
          echo "Windows build not implemented yet"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.2
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_i686"
          CIBW_BEFORE_BUILD: |
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y zlib1g-dev build-essential
              make bwa/libbwa.a
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install zlib
              make bwa/libbwa.a
            fi
          CIBW_ENVIRONMENT: |
            CIBW_BEFORE_BUILD_LINUX="sudo apt-get update && sudo apt-get install -y zlib1g-dev build-essential && make bwa/libbwa.a"
            CIBW_BEFORE_BUILD_MACOS="brew install zlib && make bwa/libbwa.a"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build BWA static library
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev build-essential
          make bwa/libbwa.a

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Build source distribution
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  upload:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: dist

      - name: Download macOS wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-macos-latest
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
